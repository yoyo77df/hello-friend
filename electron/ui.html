<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MYRAA — Neural Desktop Companion</title>
<style>
  :root {
    --bg: #020611;
    --panel: rgba(15, 23, 42, 0.7);
    --border: rgba(56, 189, 248, 0.25);
    --neon: #38bdf8;
    --neon2: #a855f7;
    --text: #e2e8f0;
    --muted: #64748b;
    --ok: #4ade80;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', Rajdhani, system-ui, sans-serif; overflow: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 20% 20%, rgba(56,189,248,0.15), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(168,85,247,0.15), transparent 40%);
  }
  .app { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); }
  .brand { font-family: Orbitron, sans-serif; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(90deg, var(--neon), var(--neon2)); -webkit-background-clip: text; color: transparent; font-size: 20px; }
  .status { font-size: 12px; color: var(--muted); }
  .status .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
    background: var(--ok); box-shadow: 0 0 10px var(--ok); margin-right:6px; }

  main { display: flex; flex-direction: column; padding: 20px; gap: 14px; overflow: hidden; }
  .chat { flex: 1; overflow-y: auto; padding: 12px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(20px); }
  .msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; max-width: 82%;
    line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { margin-left: auto; background: rgba(56,189,248,0.15); border:1px solid var(--border); }
  .msg.ai   { background: rgba(168,85,247,0.12); border:1px solid rgba(168,85,247,0.3); }
  .msg.sys  { background: rgba(255,255,255,0.04); color: var(--muted); font-size:12px; font-family: 'JetBrains Mono', monospace; }
  .msg .cmds { margin-top: 6px; font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  form { display: flex; gap: 10px; }
  input[type=text] { flex:1; padding: 14px 16px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; color: var(--text);
    font-size: 15px; outline: none; }
  input[type=text]:focus { border-color: var(--neon); box-shadow: 0 0 0 3px rgba(56,189,248,0.2); }
  button { padding: 14px 22px; background: linear-gradient(135deg, var(--neon), var(--neon2));
    border: 0; border-radius: 12px; color: white; font-weight: 700; letter-spacing: 1px;
    cursor: pointer; font-size: 14px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  aside { border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .quick button { padding: 10px; font-size: 12px; letter-spacing: 0.5px; background: var(--panel);
    border: 1px solid var(--border); color: var(--text); }
  h3 { margin: 0; font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  .log { flex: 1; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; border: 1px solid var(--border); }
  .log div { padding: 2px 0; color: var(--muted); }
  .log div.ok { color: var(--ok); }
  .log div.err { color: var(--err); }

  #keydlg { position: fixed; inset:0; background: rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index: 100; }
  #keydlg.show { display: flex; }
  #keydlg .card { background: #0f172a; padding: 28px; border-radius: 16px; border:1px solid var(--border); width: 460px; }
  #keydlg h2 { margin: 0 0 8px; font-family: Orbitron; letter-spacing: 2px; }
  #keydlg p  { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
</style>
</head>
<body>
<div id="keydlg">
  <div class="card">
    <h2>Setup MYRAA</h2>
    <p>Sir, apnar Lovable API key din — AI chat er jonno lagbe. Ekbar shob, tarpor mone thakbe.</p>
    <form id="keyform" style="flex-direction:column; gap:12px;">
      <input id="apikey" type="text" placeholder="lovable_pat_..." autocomplete="off" />
      <button type="submit">Save & Continue</button>
    </form>
  </div>
</div>

<div class="app">
  <header>
    <div class="brand">◆ MYRAA</div>
    <div class="status"><span class="dot"></span><span id="statusText">Initializing...</span></div>
  </header>

  <main>
    <div class="chat" id="chat"></div>
    <form id="cmdform">
      <input id="prompt" type="text" placeholder="Command dao Sir... (e.g. chrome open koro, gmail kholo, volume up)" autocomplete="off" autofocus />
      <button type="submit" id="sendbtn">SEND</button>
    </form>
  </main>

  <aside>
    <h3>Quick Actions</h3>
    <div class="quick">
      <button data-q="chrome open koro">🌐 Chrome</button>
      <button data-q="notepad open koro">📝 Notepad</button>
      <button data-q="calculator open koro">🧮 Calc</button>
      <button data-q="file explorer open koro">📁 Files</button>
      <button data-q="spotify open koro">🎵 Spotify</button>
      <button data-q="volume up koro">🔊 Vol+</button>
      <button data-q="volume down koro">🔉 Vol-</button>
      <button data-q="mute toggle koro">🔇 Mute</button>
      <button data-q="pc lock koro">🔒 Lock</button>
      <button data-q="screenshot nao">📸 Screen</button>
    </div>
    <h3>Activity Log</h3>
    <div class="log" id="log"></div>
    <button id="setkey" style="background: transparent; border:1px solid var(--border); color: var(--muted); font-size:11px; padding:8px;">Change API Key</button>
  </aside>
</div>

<script>
const chat = document.getElementById('chat');
const log  = document.getElementById('log');
const form = document.getElementById('cmdform');
const promptInput = document.getElementById('prompt');
const sendBtn = document.getElementById('sendbtn');
const statusText = document.getElementById('statusText');
const keydlg = document.getElementById('keydlg');
const keyform = document.getElementById('keyform');

function addMsg(role, text, cmds) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  if (cmds && cmds.length) {
    const c = document.createElement('div');
    c.className = 'cmds';
    c.textContent = '⚡ ' + cmds.map(x => x.type + (x.command || x.target || x.url || x.action || x.key || x.query || x.text ? ': ' + (x.command || x.target || x.url || x.action || x.key || x.query || x.text) : '')).join(' · ');
    d.appendChild(c);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function addLog(text, cls) {
  const d = document.createElement('div');
  d.className = cls || '';
  d.textContent = new Date().toLocaleTimeString() + ' · ' + text;
  log.insertBefore(d, log.firstChild);
  while (log.children.length > 60) log.removeChild(log.lastChild);
}

async function init() {
  const info = await window.myraa.info();
  statusText.textContent = 'DESKTOP · ' + info.platform + ' · ' + info.user + (info.nut ? '' : ' · (nut-js off)');
  addLog('MYRAA ready on ' + info.platform, 'ok');
  addMsg('ai', 'Assalamu Alaikum Sir! Ami MYRAA — apnar personal PC assistant. Ki korte hobe bolen?');
  const hasKey = await window.myraa.hasKey();
  if (!hasKey) keydlg.classList.add('show');
}

keyform.addEventListener('submit', async (e) => {
  e.preventDefault();
  const k = document.getElementById('apikey').value.trim();
  if (!k) return;
  await window.myraa.setKey(k);
  keydlg.classList.remove('show');
  addLog('API key saved', 'ok');
});

document.getElementById('setkey').addEventListener('click', () => keydlg.classList.add('show'));

document.querySelectorAll('.quick button').forEach(b =>
  b.addEventListener('click', () => { promptInput.value = b.dataset.q; form.requestSubmit(); })
);

async function execute(cmd) {
  const label = cmd.type + ' ' + (cmd.command || cmd.target || cmd.url || cmd.action || cmd.key || cmd.query || cmd.text || '');
  addLog('→ ' + label);
  try {
    const r = await window.myraa.execute(cmd);
    addLog((r.ok ? '✓ ' : '✗ ') + label + (r.out ? ' — ' + String(r.out).slice(0,80) : ''), r.ok ? 'ok' : 'err');
  } catch (e) { addLog('✗ ' + e.message, 'err'); }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = promptInput.value.trim();
  if (!text) return;
  addMsg('user', text);
  promptInput.value = '';
  sendBtn.disabled = true;
  try {
    const res = await window.myraa.ai(text);
    if (res.error) {
      addMsg('sys', '⚠ ' + res.error);
      if (res.error.includes('API key')) keydlg.classList.add('show');
    } else {
      addMsg('ai', res.reply || '...', res.commands);
      for (const c of (res.commands || [])) await execute(c);
    }
  } catch (e) {
    addMsg('sys', '⚠ ' + e.message);
  } finally {
    sendBtn.disabled = false;
    promptInput.focus();
  }
});

init();
</script>
</body>
</html>
